services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      STORAGE_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:-geo-production-system-local-secret}
    ports:
      # Host Nginx owns 80/443 in production; backend only needs loopback access.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host Nginx is the public entry point in production.
      - "127.0.0.1:8080:80"
